<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ドレミ楽譜ルビ v6</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:0;background:#f6f7fb;color:#222}
main{max-width:760px;margin:auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #0001}
h1{font-size:24px;margin:4px 0 10px}
p{line-height:1.55}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select,button{font-size:17px;width:100%;box-sizing:border-box;padding:12px;border-radius:10px}
input[type=file],select{border:1px solid #ccc;background:#fff}
button{border:0;background:#222;color:#fff;font-weight:700;margin-top:14px}
button:disabled{opacity:.45}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#fff}
.small{font-size:13px;color:#666}
.ok{color:#147a35;font-weight:700}
</style>
</head>
<body>
<main>
<h1>🎹 ドレミ楽譜ルビ v6</h1>
<p>音符の「丸い頭」を優先して探し、指番号・スラー・書き込みをできるだけ無視します。</p>

<div class="card">
<label>① 楽譜の写真</label>
<input id="file" type="file" accept="image/*">

<label>② 音部記号</label>
<select id="clef">
<option value="auto">自動（上段ト音・下段ヘ音）</option>
<option value="treble">ト音記号</option>
<option value="bass">ヘ音記号</option>
</select>

<label>③ 調号</label>
<select id="key">
<option value="0">なし</option>
<option value="-1">♭1</option><option value="-2">♭2</option><option value="-3">♭3</option>
<option value="-4">♭4</option><option value="-5">♭5</option>
<option value="1">♯1</option><option value="2">♯2</option><option value="3">♯3</option>
<option value="4">♯4</option><option value="5">♯5</option>
</select>

<button id="go" disabled>解析する</button>
<div id="status" class="small">写真を選んでください。</div>
</div>

<div class="card">
<canvas id="c"></canvas>
<p class="small">v6は外部の解析エンジンを使いません。まず「音符の頭」の検出精度を上げる実験版です。複雑なピアノ譜では誤認識が残ることがあります。</p>
</div>
</main>

<script>
const file=document.getElementById('file');
const go=document.getElementById('go');
const status=document.getElementById('status');
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
let img=new Image();

file.addEventListener('change',()=>{
  const f=file.files && file.files[0];
  if(!f)return;
  status.textContent='写真を読み込んでいます…';
  const u=URL.createObjectURL(f);
  img.onload=()=>{
    const scale=Math.min(1,1800/img.naturalWidth);
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    go.disabled=false;
    status.textContent='読み込み完了。「解析する」を押してください。';
    URL.revokeObjectURL(u);
  };
  img.src=u;
});

function buildGray(data,w,h){
  const g=new Uint8Array(w*h);
  const dark=new Uint8Array(w*h);
  for(let i=0,p=0;i<data.length;i+=4,p++){
    const r=data[i],gg=data[i+1],b=data[i+2];
    const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b);
    const v=(r*299+gg*587+b*114)/1000;
    g[p]=v;
    // 印刷の黒・灰を優先し、赤ペン・青ペンを抑える
    if(v<150 && mx-mn<42) dark[p]=1;
  }
  return {g,dark};
}

function blur(g,w,h){
  const o=new Uint8Array(g.length);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    let s=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)s+=g[(y+dy)*w+x+dx];
    o[y*w+x]=s/9;
  }
  return o;
}

function staffLines(g,w,h){
  const score=new Float32Array(h);
  for(let y=0;y<h;y++){
    let n=0;
    for(let x=0;x<w;x++)if(g[y*w+x]<125)n++;
    score[y]=n/w;
  }
  const peaks=[];
  for(let y=1;y<h-1;y++){
    if(score[y]>.28 && score[y]>=score[y-1] && score[y]>=score[y+1]){
      if(!peaks.length || y-peaks[peaks.length-1]>2)peaks.push(y);
      else if(score[y]>score[peaks.length-1])peaks[peaks.length-1]=y;
    }
  }
  const staffs=[];
  for(let i=0;i+4<peaks.length;i++){
    const s=peaks.slice(i,i+5);
    const gap=(s[4]-s[0])/4;
    const gs=s.slice(1).map((v,j)=>v-s[j]);
    if(gap<3||gap>50)continue;
    if(gs.every(v=>Math.abs(v-gap)<Math.max(5,gap*.8))){
      if(!staffs.length || s[0]-staffs[staffs.length-1][4]>gap*2){
        staffs.push(s);
      }else{
        const old=staffs[staffs.length-1];
        if(gap<(old[4]-old[0])/4)staffs[staffs.length-1]=s;
      }
      i+=4;
    }
  }
  return staffs;
}

function removeLines(dark,w,h,staffs){
  const out=new Uint8Array(dark);
  for(const s of staffs){
    const gap=(s[4]-s[0])/4;
    for(const yy of s){
      const a=Math.max(0,Math.floor(yy-gap*.24));
      const b=Math.min(h-1,Math.ceil(yy+gap*.24));
      for(let y=a;y<=b;y++)for(let x=0;x<w;x++)out[y*w+x]=0;
    }
  }
  return out;
}

function detectHeads(mask,w,h,staffs){
  const found=[];
  for(let si=0;si<staffs.length;si++){
    const s=staffs[si],gap=(s[4]-s[0])/4;
    const y0=Math.max(0,Math.floor(s[0]-gap*1.7));
    const y1=Math.min(h-1,Math.ceil(s[4]+gap*1.7));
    const step=Math.max(2,Math.floor(gap/4));
    const rX=Math.max(2,Math.round(gap*.55));
    const rY=Math.max(2,Math.round(gap*.38));

    // 音符頭らしい「横長の局所的な黒密度」を探す。
    // 長い縦棒や長いスラーはこのスコアが低くなりやすい。
    for(let y=y0+rY;y<=y1-rY;y+=step){
      for(let x=rX;x<w-rX;x+=step){
        let count=0, left=0,right=0,top=0,bottom=0;
        for(let dy=-rY;dy<=rY;dy++){
          for(let dx=-rX;dx<=rX;dx++){
            const xx=x+dx,yy=y+dy;
            if((dx*dx)/(rX*rX)+(dy*dy)/(rY*rY)>1)continue;
            if(mask[yy*w+xx]){
              count++;
              if(dx<0)left++;
              if(dx>0)right++;
              if(dy<0)top++;
              if(dy>0)bottom++;
            }
          }
        }
        const area=Math.PI*rX*rY;
        const density=count/area;
        const side=Math.min(left,right)/Math.max(1,Math.max(left,right));
        const vert=Math.min(top,bottom)/Math.max(1,Math.max(top,bottom));
        if(density>.30 && side>.42 && vert>.18){
          found.push({x,y,staff:si,score:density*side});
        }
      }
    }
  }

  // 局所最大だけを残す
  found.sort((a,b)=>b.score-a.score);
  const out=[];
  for(const n of found){
    const gap=(staffs[n.staff][4]-staffs[n.staff][0])/4;
    const near=out.some(o=>o.staff===n.staff && Math.hypot(o.x-n.x,o.y-n.y)<gap*.75);
    if(!near)out.push(n);
  }
  out.sort((a,b)=>a.staff-b.staff||a.x-b.x);
  return out;
}

const names=['ド','レ','ミ','ファ','ソ','ラ','シ'];

function noteName(y,s,gap,clef,key){
  const di=Math.round((s[4]-y)/(gap/2));
  let idx=(clef==='bass'?4:2)+di;
  idx=((idx%7)+7)%7;
  let name=names[idx];
  const acc={};
  if(key<0)['シ','ミ','ラ','レ','ソ'].slice(0,-key).forEach(v=>acc[v]='♭');
  if(key>0)['ファ','ド','ソ','レ','ラ'].slice(0,key).forEach(v=>acc[v]='♯');
  return name+(acc[name]||'');
}

function draw(staffs,heads,clef,key){
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  for(const n of heads){
    const s=staffs[n.staff];
    const gap=(s[4]-s[0])/4;
    const cl=clef==='auto'?(n.staff%2===0?'treble':'bass'):clef;
    const text=noteName(n.y,s,gap,cl,key);
    ctx.font=Math.max(12,Math.round(gap*1.1))+'px -apple-system,BlinkMacSystemFont,sans-serif';
    const yy=n.y-gap*1.25;
    ctx.lineWidth=4;
    ctx.strokeStyle='white';
    ctx.fillStyle='#d21f1f';
    ctx.strokeText(text,n.x,yy);
    ctx.fillText(text,n.x,yy);
  }
}

go.addEventListener('click',()=>{
  if(!canvas.width)return;
  go.disabled=true;
  status.textContent='解析中…';

  setTimeout(()=>{
    try{
      const raw=ctx.getImageData(0,0,canvas.width,canvas.height);
      const m=buildGray(raw.data,canvas.width,canvas.height);
      const staffs=staffLines(blur(m.g,canvas.width,canvas.height),canvas.width,canvas.height);

      if(!staffs.length){
        status.textContent='五線譜を見つけられませんでした。';
        go.disabled=false;
        return;
      }

      const cleaned=removeLines(m.dark,canvas.width,canvas.height,staffs);
      const heads=detectHeads(cleaned,canvas.width,canvas.height,staffs);
      draw(staffs,heads,document.getElementById('clef').value,Number(document.getElementById('key').value));
      status.innerHTML='<span class="ok">解析しました。</span> 五線譜 '+staffs.length+'段・音符候補 '+heads.length+'個';
    }catch(e){
      console.error(e);
      status.textContent='解析中にエラーが起きました。';
    }
    go.disabled=false;
  },50);
});
</script>
</body>
</html>
