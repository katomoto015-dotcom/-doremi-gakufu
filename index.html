<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ドレミ楽譜ルビ v4</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f6f7fb;color:#222}main{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #0001}label{display:block;font-weight:700;margin:12px 0 6px}input,select,button{font-size:17px;width:100%;box-sizing:border-box;padding:12px;border-radius:10px}button{background:#222;color:#fff;border:0;margin-top:14px;font-weight:700}button:disabled{opacity:.45}canvas{width:100%;display:block;background:#fff;border-radius:10px}.small{font-size:13px;color:#666;line-height:1.6}</style></head>
<body><main><h1>🎹 ドレミ楽譜ルビ v4</h1><p>楽譜の写真を選んで「解析する」を押してください。</p>
<div class="card"><label>① 楽譜の写真</label><input id="file" type="file" accept="image/*">
<label>② 音部記号</label><select id="clef"><option value="auto">自動</option><option value="treble">ト音記号</option><option value="bass">ヘ音記号</option></select>
<label>③ 調号</label><select id="key"><option value="0">なし</option><option value="-1">♭1</option><option value="-2">♭2</option><option value="-3">♭3</option><option value="-4">♭4</option><option value="-5">♭5</option><option value="1">♯1</option><option value="2">♯2</option><option value="3">♯3</option><option value="4">♯4</option><option value="5">♯5</option></select>
<button id="go" disabled>解析する</button><div id="status" class="small">写真を選んでください。</div></div>
<div class="card"><canvas id="c"></canvas><p class="small">v4は外部の解析エンジンを使いません。iPhoneで読み込み待ちのまま止まらない方式です。複雑なピアノ譜はまだ近似解析です。</p></div></main>
<script>
const f=document.getElementById('file'),go=document.getElementById('go'),st=document.getElementById('status'),c=document.getElementById('c'),x=c.getContext('2d',{willReadFrequently:true});let im=new Image();
f.onchange=()=>{let q=f.files[0];if(!q)return;st.textContent='写真を読み込んでいます…';let u=URL.createObjectURL(q);im.onload=()=>{let s=Math.min(1,1800/im.naturalWidth);c.width=im.naturalWidth*s;c.height=im.naturalHeight*s;x.drawImage(im,0,0,c.width,c.height);go.disabled=false;st.textContent='読み込み完了。「解析する」を押してください。';URL.revokeObjectURL(u)};im.src=u};
function analyze(){
let w=c.width,h=c.height,d=x.getImageData(0,0,w,h).data,g=new Uint8Array(w*h);
for(let i=0,p=0;i<d.length;i+=4,p++)g[p]=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;
let score=new Float32Array(h);for(let y=0;y<h;y++){let n=0;for(let xx=0;xx<w;xx++)if(g[y*w+xx]<105)n++;score[y]=n/w}
let rows=[];for(let y=1;y<h-1;y++)if(score[y]>.42&&score[y]>=score[y-1]&&score[y]>=score[y+1]){if(!rows.length||y-rows.at(-1)>2)rows.push(y);else if(score[y]>score[rows.length-1])rows[rows.length-1]=y}
let ss=[];for(let i=0;i+4<rows.length;i++){let a=rows.slice(i,i+5),gap=(a[4]-a[0])/4;if(gap>=3&&gap<=40&&a.slice(1).every((v,j)=>Math.abs((v-a[j])-gap)<Math.max(4,gap*.7))){if(!ss.length||a[0]-ss.at(-1)[4]>gap*2.2)ss.push(a);i+=4}}
if(!ss.length){st.textContent='五線譜を見つけられませんでした。明るく、まっすぐ撮ってみてください。';go.disabled=false;return}
let mask=new Uint8Array(g);for(let s of ss){let gap=(s[4]-s[0])/4;for(let yy of s)for(let y=Math.max(0,yy-gap*.18)|0;y<=Math.min(h-1,yy+gap*.18)|0;y++)for(let xx=0;xx<w;xx++)if(mask[y*w+xx]<145)mask[y*w+xx]=255}
let seen=new Uint8Array(w*h),notes=[];
for(let si=0;si<ss.length;si++){let s=ss[si],gap=(s[4]-s[0])/4,y0=Math.max(0,s[0]-gap*3)|0,y1=Math.min(h-1,s[4]+gap*3)|0;
for(let y=y0;y<=y1;y++)for(let xx=0;xx<w;xx++){let p=y*w+xx;if(seen[p]||mask[p]>=125)continue;let q=[p],n=0,sx=0,sy=0,minx=xx,maxx=xx,miny=y,maxy=y;seen[p]=1;
while(q.length){let z=q.pop(),yy=(z/w)|0,xxx=z-yy*w;n++;sx+=xxx;sy+=yy;minx=Math.min(minx,xxx);maxx=Math.max(maxx,xxx);miny=Math.min(miny,yy);maxy=Math.max(maxy,yy);
for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){if(!dx&&!dy)continue;let nx=xxx+dx,ny=yy+dy;if(nx<0||nx>=w||ny<y0||ny>y1)continue;let np=ny*w+nx;if(!seen[np]&&mask[np]<125){seen[np]=1;q.push(np)}}}
let bw=maxx-minx+1,bh=maxy-miny+1,area=gap*gap,cy=sy/n;if(n>Math.max(8,area*.08)&&n<area*6&&bw>gap*.35&&bw<gap*4&&bh>gap*.25&&bh<gap*4&&cy>s[0]-gap*2.5&&cy<s[4]+gap*2.5)notes.push({x:sx/n,y:cy,si})}}
notes.sort((a,b)=>a.si-b.si||a.x-b.x);let out=[];for(let n of notes){let sg=(ss[n.si][4]-ss[n.si][0])/4;if(!out.some(o=>o.si===n.si&&Math.hypot(o.x-n.x,o.y-n.y)<sg*.8))out.push(n)}
x.drawImage(im,0,0,w,h);let names=['ド','レ','ミ','ファ','ソ','ラ','シ'];let key=+document.getElementById('key').value,clef=document.getElementById('clef').value;
for(let n of notes){let s=ss[n.si],gap=(s[4]-s[0])/4,cl=clef==='auto'?(n.si%2===0?'treble':'bass'):clef,di=Math.round((s[4]-n.y)/(gap/2)),idx=((cl==='bass'?1:2)+di)%7;if(idx<0)idx+=7;let t=names[idx];let acc={};if(key<0)['シ','ミ','ラ','レ','ソ'].slice(0,-key).forEach(v=>acc[v]='♭');if(key>0)['ファ','ド','ソ','レ','ラ'].slice(0,key).forEach(v=>acc[v]='♯');t+=acc[t]||'';x.font=Math.max(12,gap*1.1)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=4;x.strokeStyle='white';x.fillStyle='#d22';x.strokeText(t,n.x,n.y-gap*1.25);x.fillText(t,n.x,n.y-gap*1.25)}
st.textContent='解析しました。五線譜 '+ss.length+'段・候補 '+notes.length+'個';go.disabled=false}
go.onclick=()=>{go.disabled=true;st.textContent='解析中…';setTimeout(()=>{try{analyze()}catch(e){console.error(e);st.textContent='解析中にエラーが起きました。写真を選び直してください。';go.disabled=false}},50)};
</script></body></html>
