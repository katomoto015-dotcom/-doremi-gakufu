<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ドレミ楽譜ルビ</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f7f7fb;color:#222}main{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}button,.pick{display:inline-block;padding:12px 16px;border:0;border-radius:12px;background:#222;color:#fff;font-size:16px}input{display:none}canvas{max-width:100%;margin-top:15px;border-radius:10px;background:#eee}small{color:#666;line-height:1.6}</style></head><body><main><h1>🎼 ドレミ楽譜ルビ（試作版）</h1><section class="card"><label class="pick">📷 楽譜の写真を選ぶ<input id="file" type="file" accept="image/*"></label> <button id="go" disabled>🔎 解析する</button><canvas id="cv"></canvas><p id="msg"><small>まず楽譜の写真を選んでください。</small></p></section><section class="card"><small>現在はト音記号・単音・きれいな五線譜を対象にした簡易試作です。♯♭、調号、和音、ヘ音記号などは今後対応します。</small></section></main><script>const f=document.getElementById('file'),b=document.getElementById('go'),c=document.getElementById('cv'),x=c.getContext('2d'),m=document.getElementById('msg');let im;f.onchange=()=>{let q=f.files[0];if(!q)return;im=new Image();im.onload=()=>{let s=Math.min(1,1400/im.width);c.width=im.width*s;c.height=im.height*s;x.drawImage(im,0,0,c.width,c.height);b.disabled=false;m.textContent='写真を読み込みました。「解析する」を押してください。'};im.src=URL.createObjectURL(q)};b.onclick=()=>{let w=c.width,h=c.height,d=x.getImageData(0,0,w,h).data,rs=new Array(h).fill(0);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx+=2){let i=(y*w+xx)*4,g=(d[i]+d[i+1]+d[i+2])/3;if(g<100)rs[y]++}let ls=[];for(let y=1;y<h-1;y++)if(rs[y]>w*.35&&rs[y]>=rs[y-1]&&rs[y]>=rs[y+1]&&(!ls.length||y-ls.at(-1)>3))ls.push(y);let st=null;for(let i=0;i<ls.length-4;i++){let a=ls.slice(i,i+5),g=a.slice(1).map((v,j)=>v-a[j]),av=g.reduce((p,q)=>p+q,0)/4;if(Math.max(...g)-Math.min(...g)<=Math.max(4,av*.5)){st={a,av};break}}if(!st){m.textContent='五線を見つけられませんでした。明るく真っすぐな写真で試してください。';return}let top=st.a[0],mid=(st.a[0]+st.a[4])/2,sp=st.av;x.drawImage(im,0,0,w,h);x.font=Math.max(16,sp*1.2)+'px sans-serif';x.textAlign='center';x.textBaseline='bottom';let names=['ド','レ','ミ','ファ','ソ','ラ','シ'],seen=[];for(let y=Math.max(0,top-sp*2);y<Math.min(h,top+sp*7);y+=2)for(let xx=0;xx<w;xx+=3){let i=(y*w+xx)*4,g=(d[i]+d[i+1]+d[i+2])/3;if(g<55&&!seen.some(p=>Math.abs(p.x-xx)<18&&Math.abs(p.y-y)<12)){let k=Math.round((mid-y)/(sp/2)),n=names[((k+2)%7+7)%7];x.fillText(n,xx,Math.max(18,y-7));seen.push({x:xx,y});}}m.textContent='簡易解析しました。これは試作版なので、認識がずれる場合があります。'};</script></body></html>
